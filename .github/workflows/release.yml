# Build, self-test, attest and draft-release the desktop bundles: a Windows x64 folder
# and a macOS arm64 SawtSakinah.app, each zipped.
#
# A pushed tag vX.Y.Z (matching sawt_sakinah.__version__) produces a DRAFT release with
# the zips and SHA256SUMS; a maintainer reviews and publishes it. Running the workflow by
# hand is a dry run: same build and self-test, the zip is kept as a workflow artifact and
# nothing is attested or released.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build the SPA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the version
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          app_version=$(python3 -c "import sys; sys.path.insert(0, 'packaging'); import package; print(package.app_version())")
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
            if [ "$version" != "$app_version" ]; then
              echo "::error::tag $REF_NAME does not match sawt_sakinah.__version__ ($app_version)"
              exit 1
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            version="${app_version}-dev.${GITHUB_SHA::7}"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Collect the SPA and its package notices
        run: |
          mkdir -p spa-artifact
          cp -R frontend/dist spa-artifact/dist
          python3 packaging/third_party.py frontend frontend -o spa-artifact/frontend-licenses.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa
          path: spa-artifact
          if-no-files-found: error
          retention-days: 3

  build:
    name: Bundle (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            lock: packaging/requirements-windows.txt
            build_lock: packaging/requirements-build.txt
            app: packaging/dist/SawtSakinah
            exe: packaging/dist/SawtSakinah/SawtSakinah.exe
          - os: macos-15 # arm64 (Apple Silicon)
            platform: macos-arm64
            lock: packaging/requirements-macos.txt
            build_lock: packaging/requirements-build-macos.txt
            app: packaging/dist/SawtSakinah.app
            exe: packaging/dist/SawtSakinah.app/Contents/MacOS/SawtSakinah
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the build-provenance attestation
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      LOCK: ${{ matrix.lock }}
      BUILD_LOCK: ${{ matrix.build_lock }}
      APP: ${{ matrix.app }}
      SAWT_SPA_DIR: ${{ github.workspace }}/spa-artifact/dist
      SAWT_VENDOR_DIR: ${{ github.workspace }}/packaging/build/vendor
      SAWT_NOTICES: ${{ github.workspace }}/packaging/build/THIRD_PARTY_LICENSES.txt
      # macOS: fail the build when PyInstaller cannot sign the .app or the seal is broken.
      PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: "1"
      PYINSTALLER_VERIFY_BUNDLE_SIGNATURE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spa
          path: spa-artifact

      - name: Fetch ffmpeg, ffprobe and Deno (SHA-256 pinned)
        run: python packaging/fetch_binaries.py "$PLATFORM" "$SAWT_VENDOR_DIR"

      - name: Install the hash-pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r "$BUILD_LOCK"
          python -m pip install --require-hashes --no-build-isolation -r "$LOCK"
          python -m pip list

      # Before PyInstaller: the macOS spec seals the notices inside the signed .app.
      - name: Third-party notices
        run: python packaging/third_party.py bundle --lock "$LOCK" --vendor "$SAWT_VENDOR_DIR" --spa "$SAWT_SPA_DIR" --frontend-notices spa-artifact/frontend-licenses.txt -o "$SAWT_NOTICES"

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean --distpath packaging/dist --workpath packaging/build/pyinstaller packaging/sawt_sakinah.spec

      # Git Bash runs the Windows exe directly and waits for it like any other program.
      - name: Self-test the frozen app
        timeout-minutes: 10
        env:
          EXE: ${{ matrix.exe }}
          # Keeps the app's logs (and all its data) in a known place on every OS.
          SAWT_DATA_DIR: ${{ runner.temp }}/sawt-data
        run: |
          report="$RUNNER_TEMP/self-test.json"
          code=0
          "$EXE" --self-test --self-test-report "$report" || code=$?
          if [ -f "$report" ]; then cat "$report"; else echo 'No self-test report was written.'; fi
          if [ "$code" -ne 0 ]; then
            echo "::error::self-test failed with exit code $code"
            if [ -d "$SAWT_DATA_DIR/logs" ]; then
              for log in "$SAWT_DATA_DIR/logs"/*; do
                [ -f "$log" ] || continue
                echo "----- $log"
                tail -n 200 "$log"
              done
            else
              echo '::notice::The app wrote no logs.'
            fi
            exit 1
          fi

      - name: Zip
        run: |
          python packaging/package.py --dist "$APP" --version "$VERSION" --platform "$PLATFORM" --notices "$SAWT_NOTICES" --out packaging/release
          ls -l packaging/release

      # The zip is what users get: unpack it the way Finder does and check the seal again.
      - name: Check the zipped app (macOS)
        if: runner.os == 'macOS'
        run: |
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked"
          ditto -x -k packaging/release/SawtSakinah-*.zip "$unpacked"
          app="$unpacked/SawtSakinah.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)'
          plutil -p "$app/Contents/Info.plist"
          ls -l "$app/Contents/Frameworks/bin" "$app/Contents/Resources" | sed -n 1,40p
          for tool in ffmpeg ffprobe deno; do
            file "$app/Contents/Frameworks/bin/$tool"
          done
          "$app/Contents/Frameworks/bin/ffmpeg" -hide_banner -version | sed -n 1p
          "$app/Contents/Frameworks/bin/deno" --version | sed -n 1p

      - name: Attest build provenance
        if: needs.prepare.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packaging/release/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            packaging/release/*.zip
            packaging/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.prepare.outputs.dry_run == 'true' && 14 || 3 }}

      # upload-artifact needs one common root, so the report and the app's logs (under
      # SAWT_DATA_DIR) are copied into one folder first.
      - name: Collect the self-test logs
        if: failure()
        env:
          # Where the self-test step had the app write its logs.
          SAWT_DATA_DIR: ${{ runner.temp }}/sawt-data
        run: |
          dest="$RUNNER_TEMP/diagnostics"
          mkdir -p "$dest"
          if [ -f "$RUNNER_TEMP/self-test.json" ]; then cp "$RUNNER_TEMP/self-test.json" "$dest/"; fi
          if [ -d "$SAWT_DATA_DIR/logs" ]; then
            cp -R "$SAWT_DATA_DIR/logs" "$dest/logs"
          else
            echo '::notice::The app wrote no logs.'
          fi

      - name: Upload the self-test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test-logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Draft the GitHub release
    needs: [prepare, build]
    if: github.event_name == 'push' && needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload its assets
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum SawtSakinah-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          ytdlp=$(sed -n 's/^yt-dlp==\([^ ]*\).*/\1/p' packaging/requirements-windows.txt)
          ejs=$(sed -n 's/^yt-dlp-ejs==\([^ ]*\).*/\1/p' packaging/requirements-windows.txt)
          mac_ytdlp=$(sed -n 's/^yt-dlp==\([^ ]*\).*/\1/p' packaging/requirements-macos.txt)
          if [ "$mac_ytdlp" != "$ytdlp" ]; then
            echo "::error::the Windows and macOS locks pin different yt-dlp versions"
            exit 1
          fi
          pin() { jq -r ".platforms[\"$1\"].$2.version" packaging/binaries.json; }
          cat > notes.md <<EOF
          ## Download

          **Windows 10 22H2 / 11 (x64)**: \`SawtSakinah-${VERSION}-windows-x64.zip\`. Unzip it and
          run \`SawtSakinah.exe\`. The app is not code-signed yet, so SmartScreen asks first:
          choose **More info**, then **Run anyway**.

          **macOS 14 or later on Apple Silicon (M1 or newer)**:
          \`SawtSakinah-${VERSION}-macos-arm64.zip\`. Unzip it and move **SawtSakinah.app** to
          Applications. The app is not signed or notarized by Apple, so macOS blocks the first
          launch:

          1. Open the app once, and close the warning that it cannot be opened.
          2. Open **System Settings > Privacy & Security**, scroll down to **Security** and click
             **Open Anyway** next to the message about SawtSakinah, then confirm.

          If no **Open Anyway** button appears, run this in Terminal and open the app again:
          \`xattr -dr com.apple.quarantine /Applications/SawtSakinah.app\`

          Intel Macs are not supported; they can run the app from source. See the README for
          requirements.

          Verify a download:

          \`\`\`
          gh attestation verify SawtSakinah-${VERSION}-<platform>.zip -R ${GH_REPO}
          \`\`\`

          or compare its SHA-256 with \`SHA256SUMS\`.

          ## Bundled components

          - yt-dlp ${ytdlp} (with yt-dlp-ejs ${ejs}), on both platforms
          - Windows: FFmpeg $(pin windows-x64 ffmpeg) (LGPL build) and Deno $(pin windows-x64 deno)
          - macOS: FFmpeg $(pin macos-arm64 ffmpeg) (GPL v3 build) and Deno $(pin macos-arm64 deno)

          ## Network use

          The app talks to the network only for:
          - **YouTube**, when you import a video by URL.
          - **Hugging Face**, to download the speech model once, the first time phrase detection runs.
          - **GitHub API**, to check for a newer release (can be turned off in the app).

          There is no telemetry.

          EOF
          cat notes.md

      - name: Create the draft release
        run: |
          gh release create "$TAG" dist/SawtSakinah-*.zip dist/SHA256SUMS \
            --draft --verify-tag \
            --title "Sawt Sakinah $VERSION" \
            --notes-file notes.md --generate-notes
