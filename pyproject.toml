[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sawt-sakinah"
dynamic = ["version"]
description = "Extract Quran recitation audio from YouTube, detect silences, recognize the surahs recited, and edit non-destructively."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

# Core runtime: extraction (yt-dlp + ffmpeg), the shared pydantic contracts, and the
# YAML config loader. ffmpeg/ffprobe (and Deno, which yt-dlp uses to solve YouTube's
# JavaScript challenges) are standalone binaries, not pip deps. yt-dlp-ejs holds the
# challenge-solver scripts Deno runs; keep it at the version yt-dlp's `default` extra pins.
# requests/brotli/certifi are the networking companions from that extra; mutagen (GPL,
# only used for embedding thumbnails) is left out so the bundle stays GPL-free.
# curl_cffi lets yt-dlp impersonate a browser (Instagram's logged-out path needs it); yt-dlp
# drops impersonation for versions outside 0.10.x-0.16.x, so keep this range inside the one
# its `curl-cffi` extra accepts (its `pin-curl-cffi` extra pins the exact version).
# packaging reads that range from a downloaded yt-dlp's metadata (see ytdlp_updates.py).
# platformdirs places user data in the desktop bundle (see runtime.py).
dependencies = [
    "yt-dlp>=2026.6.9",
    "yt-dlp-ejs>=0.8.0",
    "requests>=2.32.2",
    "brotli>=1.1",
    "certifi",
    "curl-cffi>=0.10,<0.17",
    "packaging>=22",
    "pydantic>=2",
    "PyYAML>=6",
    "platformdirs>=4",
]

# Optional feature sets. The library imports each lazily, so the core install never
# needs them. Install a feature with e.g. `pip install -e ".[service]"`.
[project.optional-dependencies]
# FastAPI service layer (sawt_sakinah.service). numpy backs the waveform peaks;
# python-multipart parses the file-upload form on POST /projects/upload.
service = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2",
    "numpy>=1.24",
]
# Whisper transcription for surah recognition (detection/transcribe.py and
# detection/surahs.py). faster-whisper runs Whisper through CTranslate2, so torch is not
# required; rapidfuzz powers the fuzzy word matching against the Quran text. huggingface_hub
# downloads the model; the app's model manager uses its 1.x API (httpx session). tokenizers
# caps it below 2.0.
transcription = [
    "faster-whisper>=1.0",
    "rapidfuzz>=3.0",
    "huggingface_hub>=1.0",
]
# Silero VAD speech segmentation (detection/segmentation.py; the "vad" silence detector
# and speech-scoped transcription build on it). The network ships as a vendored ONNX
# file under sawt_sakinah/detection/assets and runs on onnxruntime + numpy; no torch.
vad = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
]
# Desktop shell (sawt_sakinah.desktop): a native window over the local service via
# pywebview. Requires the built SPA (frontend/dist) and the `service` extra. Kept out of
# `all` so headless/server installs never pull a GUI toolkit.
desktop = [
    "pywebview>=5",
]
# Everything (self-referencing extra; requires a recent pip).
all = [
    "sawt-sakinah[service,transcription,vad]",
]
# Development tools: the linter CI runs and the bundler `make bundle` uses. Release
# builds install PyInstaller from the hash-pinned packaging/requirements-build.txt.
dev = [
    "ruff>=0.12",
    "pyinstaller>=6.10",
]

[project.scripts]
# Console entry point. Equivalent to `python -m sawt_sakinah`.
sawt = "sawt_sakinah.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sawt_sakinah.__version__" }

[tool.setuptools.packages.find]
include = ["sawt_sakinah*"]

[tool.setuptools.package-data]
# PEP 561 marker: the package is fully annotated, so type checkers may use it inline.
"sawt_sakinah" = ["py.typed"]
# Ship the single-source-of-truth config alongside the code.
"sawt_sakinah.config" = ["*.yaml"]
# Vendored Silero VAD network (ONNX), Tanzil Quran text and surah metadata, and their licenses.
"sawt_sakinah.detection" = ["assets/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["frontend", "packaging/build", "packaging/dist"]

[tool.ruff.lint]
# Pyflakes plus the syntax and statement checks: real errors, no style churn.
select = ["E4", "E7", "E9", "F"]
