# Single source of truth for every tuning knob in sawt_sakinah.
#
# This file is the ONLY place default thresholds / durations / model choices /
# quality settings live. Code reads these values via ``sawt_sakinah.config``
# (the ``CONFIG`` object); no module carries its own hidden literal defaults.
#
# Every key below is REQUIRED -- the loader validates against a strict schema and
# raises if a key is missing or unknown, so the file can never drift out of sync
# with the code. Nullable knobs (e.g. ``merge_gap``) are written explicitly as
# ``null`` so even "no value" is set in one visible place.
#
# Users may override any subset of keys in a per-user config.yaml (merged onto this
# file). In a source checkout SAWT_CONFIG_FILE may point at an alternate copy of this
# file to swap the whole set of defaults; service-only operational settings
# additionally accept SAWT_* environment overrides (see service/settings.py).

# ffmpeg/ffprobe executables used by every subprocess call. A bare name resolves to the
# bundled copy (or PATH in a source checkout); an absolute path is used as given.
ffmpeg:
  bin: ffmpeg
  ffprobe_bin: ffprobe
  timeout_sec: 3600            # stop any single ffmpeg/ffprobe run after this many seconds

# Standardized signal the detection layer is fed (energy gate + Silero/WebRTC VAD
# both expect this). Used for the PCM decode and the normalized working copy.
audio:
  working_sample_rate: 16000

# Audio acquisition (yt-dlp download + file upload, both via ffmpeg) defaults.
extraction:
  audio_format: mp3       # ffmpeg target format/extension
  audio_quality: "0"      # ffmpeg quality: "0" = best VBR, or a bitrate like "192K"
  quiet: true             # suppress yt-dlp console output
  create_working_copy: true   # also emit the 16 kHz mono WAV detection feeds on
  create_speech_map: true     # compute the Silero speech-probability sidecar alongside the working copy
  normalize_loudness: false   # apply EBU R128 loudnorm to the working copy
  use_cache: true             # reuse/persist extractions keyed by url+format+quality
  max_upload_mb: 500          # reject uploads larger than this (streamed, not trusted from headers)
  max_download_mb: 1024       # reject YouTube audio streams larger than this
  max_duration_sec: 21600     # reject YouTube videos longer than this (6 hours), before downloading
  allowed_upload_extensions:  # file types the upload endpoint accepts (transcoded to audio_format)
    - .mp3
    - .wav
    - .m4a
    - .aac
    - .flac
    - .opus
    - .ogg
    - .mov
    - .mp4
    - .m4v

# Speech segmentation: turning the per-frame Silero speech probabilities (computed once
# per source, persisted as the speech-map sidecar) into fine speech spans. Every consumer
# (silence detection, phrase clip scoping, onset snapping) thresholds the same map with
# these knobs and then applies its own coarser rules on top.
segmentation:
  speech_threshold: 0.5        # speech-probability threshold (0..1); the leave threshold is 0.15 lower, floored at 0.01
  min_speech_duration: 0.25    # drop speech runs shorter than this (seconds)
  bridge_gap: 0.2              # speech runs separated by less than this merge in the fine pass (Silero's min_silence)
  speech_pad: 0.03             # seconds added to each side of a speech span

# Silence detection AND removal share these knobs (one concept, one source). The
# ffmpeg energy-gate path uses threshold_db/min_silence_duration; the "vad" detector
# inverts the segmentation speech spans and reports gaps >= min_silence_duration.
# keep_silence applies on the editing side.
silence:
  threshold_db: -40.0          # dB below which audio counts as silence (ffmpeg detector only)
  min_silence_duration: 3.0    # min seconds of a quiet run to report/cut (1s gaps are common mid-recitation)
  keep_silence: 0.0            # seconds of silence left in place at each cut (editing)
  merge_gap: null              # merge adjacent silences within this gap; null disables
  measure_loudness: true       # populate SilenceSegment.mean_db via a volumedetect pass
  detector: vad                # "vad" thresholds the persisted speech-probability map; "ffmpeg" is the dependency-free energy gate

# Spoken-phrase (Whisper) detection.
phrases:
  detector: whisper            # "whisper" (implemented) or "embeddings" (planned)
  model_size: large-v3-turbo   # default Whisper model; must be an id under whisper_models (users pick another in the app)
  device: cpu                  # inference device; the desktop bundle is CPU-only
  compute_type: int8           # CTranslate2 compute type ("int8" is the fast CPU choice)
  language: ar                 # transcription language code
  min_confidence: 0.4          # drop markers below this confidence (0..1)
  min_gap_between_markers: 1.0  # de-dup same-type hits closer than this (seconds)
  max_word_gap: 1.0            # max seconds between consecutive words of one phrase
  vad_filter: true             # apply Whisper's built-in VAD filter; only used when no speech map/spans are available
  snap_window: 0.4             # snap marker onsets/ends to the nearest speech-span edge within this distance (seconds); 0 disables
  clip_merge_gap: 1.0          # speech spans closer than this are merged into one Whisper clip (seconds)
  clip_pad: 0.3                # seconds of context added around each clip
  keyword_gate: 78.0           # each required keyword must partial-match >= this (0..100)
  fuzzy_floor: 60.0            # whole-phrase token_sort_ratio floor before scoring (0..100)
  fuzzy_weight: 0.6            # confidence = fuzzy_weight*fuzzy + (1-fuzzy_weight)*prob

# Whisper models the app can download and run (CTranslate2 conversions, CPU). Only these
# ids are accepted anywhere. Each is pinned to a Hugging Face commit so a re-upload can't
# change it silently; size_mb is the download size of the files faster-whisper loads.
whisper_models:
  large-v3-turbo:
    label: Large v3 Turbo
    description: Fast and accurate. Recommended for most recordings.
    repo: mobiuslabsgmbh/faster-whisper-large-v3-turbo
    revision: 0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf
    size_mb: 1622
  large-v3:
    label: Large v3
    description: Higher accuracy, slower. Needs about twice the memory and disk space.
    repo: Systran/faster-whisper-large-v3
    revision: edaa852ec7e145841d8ffdb056a99866b5f0a478
    size_mb: 3091

# EDL render / export.
editing:
  out_format: mp3              # default output extension/codec
  boundary_fade: 0.005         # seconds of fade at each cut boundary to avoid clicks
  mp3_vbr_quality: "0"         # default VBR quality for mp3 when no bitrate is given
  embed_markers: true          # embed marker ops as chapters on export
  embed_metadata: true         # refresh title/source-url metadata on export

# FastAPI service operational defaults. These additionally accept SAWT_* env overrides.
service:
  max_workers: 4               # general job pool threads (extraction/silence/export)
  phrase_workers: 1            # dedicated Whisper pool threads (keep 1 unless device allows)
  max_pending_jobs: 32         # pending + running jobs accepted before new submissions get HTTP 429
  waveform_buckets: 2000       # downsample resolution for the waveform peaks endpoint
  stream_chunk_size: 65536     # byte chunk size for ranged media streaming responses
  shutdown_grace_sec: 3        # on close, time running jobs get to stop and clean up

# Desktop app: the update check against the project's GitHub releases.
app:
  release_repo: H-Khan26/sawt-sakinah   # <owner>/<repo> whose latest release is checked
  update_check_interval_hours: 24       # at most one check per interval
  update_check_timeout_sec: 5           # network timeout for one check
